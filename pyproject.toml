[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "videos-multi-view"
version = "1.0.0"
description = "Local video comparison and composition desktop tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*", "vendor/ffmpeg/LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1", "pyinstaller>=6,<7"]

[project.gui-scripts]
videos-multi-view = "videos_multi_view.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
videos_multi_view = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["integration: real FFmpeg and media tests", "local_assets: optional private inputs"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", "vendor", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
